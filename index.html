<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculatrice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculatrice">
    <div class="ecran" id="ecran">0</div>

    <div class="boutons">
      <button class="btn action" data-action="clear">C</button>
      <button class="btn operateur" data-valeur="/">÷</button>
      <button class="btn operateur" data-valeur="*">×</button>
      <button class="btn operateur" data-valeur="-">−</button>

      <button class="btn" data-valeur="7">7</button>
      <button class="btn" data-valeur="8">8</button>
      <button class="btn" data-valeur="9">9</button>
      <button class="btn operateur" data-valeur="+">+</button>

      <button class="btn" data-valeur="4">4</button>
      <button class="btn" data-valeur="5">5</button>
      <button class="btn" data-valeur="6">6</button>
      <button class="btn egal" data-action="egal">=</button>

      <button class="btn" data-valeur="1">1</button>
      <button class="btn" data-valeur="2">2</button>
      <button class="btn" data-valeur="3">3</button>

      <button class="btn zero" data-valeur="0">0</button>
      <button class="btn" data-valeur=".">.</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>s
